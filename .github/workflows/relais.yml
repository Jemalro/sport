name: Mise à jour automatique

on:
  schedule:
    - cron: '*/20 * * * *'   # rapide : toutes les 20 minutes
    - cron: '15 4 * * *'     # quotidien : 4h15 UTC (6h15 à Paris l'été, 5h15 l'hiver)
    - cron: '30 2 * * 1'     # complet : le lundi à 2h30 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: "Type de mise à jour"
        type: choice
        options:
          - rapide
          - quotidien
          - complet
          - equipes
        default: rapide

concurrency:
  group: mise-a-jour
  cancel-in-progress: false

jobs:
  maj:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Mettre à jour les données
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          RELAIS_CLE: ${{ secrets.RELAIS_CLE }}
          MODE: ${{ inputs.mode || (github.event.schedule == '15 4 * * *' && 'quotidien') || (github.event.schedule == '30 2 * * 1' && 'complet') || 'rapide' }}
        run: |
          echo "Mode : $MODE"

          # Une réponse vide ou en HTML (« <… ») = blocage passager de l'hébergeur : on réessaie
          bloque() { case "$1" in ""|"<"*) return 0 ;; *) return 1 ;; esac; }

          importer() {
            for essai in 1 2 3; do
              resultat=$(curl -sS -m 300 -H "X-Relais-Cle: $RELAIS_CLE" \
                "$SITE_URL/relais/importer.php?source=$1&mode=$2" || true)
              bloque "$resultat" || break
              sleep 10
            done
            if bloque "$resultat"; then echo "ÉCHEC import $1 (site injoignable)"; else echo "$resultat"; fi
          }

          relayer() {
            for essai in 1 2 3; do
              code=$(curl -sS -o urls.txt -w "%{http_code}" \
                -H "X-Relais-Cle: $RELAIS_CLE" "$SITE_URL/relais/a_faire.php?etape=$1" || true)
              [ "$code" = "200" ] && break
              sleep 10
            done
            if [ "$code" != "200" ]; then
              echo "Étape $1 : mon site a répondu HTTP $code"
              return 1
            fi
            echo "### Étape $1 : $(grep -c . urls.txt || true) URL à traiter"

            while read -r url; do
              [ -z "$url" ] && continue
              for essai in 1 2 3; do
                code=$(curl -sS -o reponse.json -w "%{http_code}" "$url" || true)
                case "$code" in 200|400|404) break ;; esac
                sleep 5
              done
              if [ "$code" != "200" ]; then
                echo "$url -> ÉCHEC ESPN (HTTP $code)"
                sleep 1
                continue
              fi
              for essai in 1 2 3; do
                resultat=$(curl -sS -X POST \
                  -H "X-Relais-Cle: $RELAIS_CLE" \
                  -H "X-Relais-Url: $url" \
                  -H "Content-Type: application/json" \
                  --data-binary @reponse.json \
                  "$SITE_URL/relais/recevoir.php" || true)
                bloque "$resultat" || break
                sleep 5
              done
              if bloque "$resultat"; then
                echo "$url -> ÉCHEC envoi au site (bloqué 3 fois)"
              else
                echo "$url -> $resultat"
              fi
              sleep 1
            done < urls.txt
          }

          case "$MODE" in
            rapide)
              importer mlb rapide
              importer nhl rapide
              relayer rapide
              ;;
            quotidien)
              importer mlb complet
              importer nhl complet
              relayer 1 && relayer 2court
              ;;
            complet)
              importer mlb complet
              importer nhl complet
              relayer 1 && relayer 2
              ;;
            equipes)
              relayer equipes
              ;;
          esac
