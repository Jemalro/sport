name: Import MLB et NHL

on:
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Demander à Hostinger d'importer MLB et NHL
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          RELAIS_CLE: ${{ secrets.RELAIS_CLE }}
        run: |
          for s in mlb nhl; do
            curl -sS -m 300 -H "X-Relais-Cle: $RELAIS_CLE" "$SITE_URL/relais/importer.php?source=$s"
          done
